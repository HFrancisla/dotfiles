# 1. 启用 Wayland 原生支持
--ozone-platform-hint=auto
--enable-wayland-ime

# 2. 彻底封杀 Vulkan 避免底层冲突
--disable-gpu-vulkan
--disable-features=Vulkan
--use-angle=gl

# 3. 强制开启 GPU 硬件加速与视频硬解 (修复直播黑屏卡顿)
--ignore-gpu-blocklist
--enable-gpu-rasterization
# --enable-zero-copy # 注意：NVIDIA/混合显卡下开启可能导致严重抖动掉帧，若有冲突请保持注释
--enable-features=VaapiVideoDecoder,VaapiIgnoreDriverChecks,VaapiVideoEncoder
# in 笔记本暗夜精灵5 (注意：多设备同步时该选项会导致其他机器卡顿，已注释)
# --gpu-testing-vendor-id=0x8086
