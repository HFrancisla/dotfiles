# 通用
set-option -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g window-size latest
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on

setw -g monitor-activity on
set -g visual-activity off

# 终端
set -g default-terminal "tmux-256color"
set -s set-clipboard on
set -as terminal-features ",xterm*:RGB,screen*:RGB,tmux*:RGB,kitty*:RGB,foot*:RGB,alacritty*:RGB,wezterm*:RGB"
set -as terminal-overrides ',xterm*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',xterm*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Ctrl+Space 留给 Fcitx5。
set-option -g prefix C-b
bind-key C-b send-prefix

# 状态栏
set-option -g status-style "bg=default"
set-option -g status-left-length 200
set-option -g status-left " #{session_name}  "
set-option -g status-left-style "#{?client_prefix,bg=#f7768e fg=black bold,default}"
set -g status-right "#{simple_git_status}"

set-option -g window-status-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-style "fg=#e1a345"
set-option -g window-status-last-style "fg=#936a2e"
set-option -g window-status-activity-style none

# 按键
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "配置已重载"
bind-key : command-prompt
bind-key s choose-session
bind-key n display-panes

bind-key S new-session
bind-key enter new-window -c "#{pane_current_path}"
bind-key f resize-pane -Z
bind-key Space last-window
bind-key X command-prompt -p "kill window: " "kill-window -t '%%'"

bind-key g new-window -n lazygit -c "#{pane_current_path}" "lazygit"
bind-key r new-window -n serpl -c "#{pane_current_path}" "serpl"
bind-key o command-prompt -p "open app: " "new-window '%%'"

bind-key . next-window
bind-key , previous-window

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key q kill-pane
bind-key B break-pane -d
bind-key E command-prompt -p "join pane from: " "join-pane -h -s '%%'"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key H swap-pane -d -t '{left-of}'
bind-key J swap-pane -d -t '{down-of}'
bind-key K swap-pane -d -t '{up-of}'
bind-key L swap-pane -d -t '{right-of}'

bind-key -r Up resize-pane -U 5
bind-key -r Down resize-pane -D 5
bind-key -r Left resize-pane -L 5
bind-key -r Right resize-pane -R 5

# 复制
bind-key c copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# 跳转
bind-key C-e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session |\
    xargs -r tmux switch-client -t"

bind-key C-f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-window |\
    cut -d ' ' -f 1 |\
    xargs -r tmux select-window -t"

bind-key b switch-client -l
bind-key t set-option -g status
bind-key C-k run-shell "tmux set-option -g status-position top;"
bind-key C-j run-shell "tmux set-option -g status-position bottom;"

# 插件
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'kristijanhusak/tmux-simple-git-status'

# continuum 保存状态，但不自动恢复。
set -g @continuum-restore 'off'

set -g @tmux-fzf-launch-key 'F'

run '~/.config/tmux/plugins/tpm/tpm'
