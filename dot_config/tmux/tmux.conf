### 1. 基础设置 ###
set-option -g mouse on        # 开启鼠标支持
set -g base-index 1           # 窗口序号从 1 开始
setw -g pane-base-index 1      # 窗格序号从 1 开始
set -g renumber-windows on     # 关闭窗口后自动重新排列序号
set -g detach-on-destroy off  # 关闭当前会话最后一个窗口时跳到其他会话，不退出
set -g set-titles on           # 允许 tmux 设置终端标题
set -g window-size latest        # 多显示器适配: 按当前活动客户端调整窗口大小
set -s escape-time 10
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on

# 监控活动
setw -g monitor-activity on    # 监控窗口活动
set -g visual-activity off     # 关闭文字提示，仅在状态栏显示

# 终端显示增强 (真彩与下划线)
set -g default-terminal "tmux-256color"
set -s set-clipboard on            # 启用 OSC 52 剪贴板同步
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'


# 修改前缀键为 Ctrl + Space
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# 状态栏设置
set-option -g status-style "bg=default"
set-option -g status-left-length 200
set-option -g status-left " #{session_name}  "
set-option -g status-left-style "#{?client_prefix,bg=#f7768e fg=black bold,default}"
set -g status-right "#{simple_git_status}"

set-option -g window-status-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-format "#{window_index}:#{window_name}#{window_flags} "
set-option -g window-status-current-style "fg=#e1a345"
set-option -g window-status-last-style "fg=#936a2e"
set-option -g window-status-activity-style none


# 系统快捷键
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "配置已重载"
bind-key : command-prompt
bind-key s choose-session
bind-key n display-panes

### 2. 窗口管理 ###
bind-key S new-session        # 前缀+S 新建Session
bind-key enter new-window -c "#{pane_current_path}"     # 前缀 + Enter 新建窗口 (对齐 Hyprland Super+Enter)
bind-key f resize-pane -Z     # 前缀 + f 最大化/恢复窗格 (对齐 Hyprland Super+F)
bind-key Space last-window    # 前缀 + Space 快速跳转回上一个窗口
bind-key X command-prompt -p "kill window: " "kill-window -t '%%'" # 前缀 + X 交互式关闭指定窗口

# 快捷工具集成
bind-key g new-window -n lazygit -c "#{pane_current_path}" "lazygit"
bind-key r new-window -n serpl -c "#{pane_current_path}" "serpl"
bind-key o command-prompt -p "open app: " "new-window '%%'"


# 窗口切换 (使用前缀键对齐，避免劫持应用层按键)
# Prefix + . (下一个) / Prefix + , (上一个) 
bind-key . next-window
bind-key , previous-window

### 3. 窗格管理 (分屏与导航) ###
# 分屏 (对齐 LazyVim/Neovim 语义)
bind-key | split-window -h -c "#{pane_current_path}"    # 垂直切分
bind-key - split-window -v -c "#{pane_current_path}"    # 水平切分
bind-key q kill-pane          # 关闭窗格 (对齐 Hyprland Super+Q)
bind-key B break-pane -d      # 前缀 + B 将当前窗格剥离为独立窗口
bind-key E command-prompt -p "join pane from: " "join-pane -h -s '%%'" # 前缀 + E 将指定窗格拉回

# 焦点移动 (Vim 风格: h/j/k/l)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Smart pane switching with awareness of vim splits (Ctrl + hjkl)
# 由 TPM 插件 christoomey/vim-tmux-navigator 自动管理，无需手动定义
# is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
# bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
# bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
# bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
# bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

# 窗口交换 (对齐 Hyprland Super+Shift+HJKL)

bind-key H swap-pane -d -t '{left-of}'
bind-key J swap-pane -d -t '{down-of}'
bind-key K swap-pane -d -t '{up-of}'
bind-key L swap-pane -d -t '{right-of}'

# 调整窗格大小 (前缀 + 方向键)
bind-key -r Up resize-pane -U 5
bind-key -r Down resize-pane -D 5
bind-key -r Left resize-pane -L 5
bind-key -r Right resize-pane -R 5

### 4. 复制模式 (Vim 风格) ###
bind-key c copy-mode
setw -g mode-keys vi
# 选择与复制
bind-key -T copy-mode-vi v send-keys -X begin-selection            # v 开始选择
bind-key -T copy-mode-vi y send-keys -X copy-pipe                  # y 复制 (同步到系统剪贴板)
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

### 5. 高级交互 (FZF 弹出窗口) ###
# Prefix + C-e: 弹出搜索窗口跳转到其他会话
bind-key C-e display-popup -E "\
    tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session |\
    xargs tmux switch-client -t"

# Prefix + C-f: 弹出搜索窗口跳转到当前会话的其他窗口
bind-key C-f display-popup -E "\
    tmux list-windows -F '#{window_index} #{window_name}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-window |\
    cut -d ' ' -f 1 |\
    xargs tmux select-window -t"

bind-key b switch-client -l    # 前缀 + b 快速跳转回上一个 Session
bind-key t set-option -g status # 前缀 + t 切换状态栏显示/隐藏
bind-key C-k run-shell "tmux set-option -g status-position top;"    # 前缀 + Ctrl-k 状态栏置顶
bind-key C-j run-shell "tmux set-option -g status-position bottom;" # 前缀 + Ctrl-j 状态栏置底

### 6. 插件管理 (TPM) ###
# 安装 TPM（如果还没装）:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'kristijanhusak/tmux-simple-git-status'


# 自动恢复工作区状态
set -g @continuum-restore 'off'

# tmux-fzf 设置（可选）
set -g @tmux-fzf-launch-key 'F'       # 前缀 + F 启动 (改为大写避免与缩放冲突)

# 初始化 TPM（必须放在配置文件最后一行）
run '~/.config/tmux/plugins/tpm/tpm'
