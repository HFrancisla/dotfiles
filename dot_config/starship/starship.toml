format = """\
[╭╴](fg:arrow)\
$username\
$os\
(\
    $directory\
)\
$git_branch\
(\
    via \
    $python\
    $conda\
    $nodejs\
    $c\
    $rust\
    $java\
)
[╰─](fg:arrow)$character\
"""

right_format="""
$cmd_duration\
$env_var
$status
"""

add_newline = false

palette = "normal"

[palettes.normal]
arrow = "#c678dd"
os = "#c678dd"
os_admin = "#e4ff1a"
directory = "#e5c07b"
node = "#a5e6ba"
git = "#56b6c2"
python = "#edf67d"
conda = "#70e000"
java = "#F86279"
rust = "#ffdac6"
clang = "#caf0f8"
duration = "green"
text_light = "#26272A"

[username]
style_user = 'bold os'
style_root = 'bold os_admin'
format = '[  $user](fg:$style) '
disabled = false
show_always = true

[os]
format = "[$symbol]($style) "
style = "bold blue"
disabled = false

[os.symbols]
Alpine = " "
Arch = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
openSUSE = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "

[status]
disabled = false
format = '[$status](fg:red) '

[character]
success_symbol = "[▸](fg:arrow)"
error_symbol = "[▸](fg:arrow)[✘](fg:red)"

[directory]
format = "[$read_only]($read_only_style)[$path](bold $style) "
truncation_length = 15
style = "fg:directory"
read_only_style = "fg:directory"
before_repo_root_style = "fg:directory"
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " "

[cmd_duration]
format = "[ $duration]($style) "
style = "bold fg:duration"
min_time = 1000

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold fg:git"

[nodejs]
format = "[ $symbol$version ]($style)"
style = "bg:node fg:text_light"
symbol = " "
version_format = "${raw}"
disabled = false

[python]
disabled = false
format = '[ ${symbol}${pyenv_prefix}(${version})( \($virtualenv\)) ]($style)'
symbol = " "
version_format = "${raw}"
style = "bg:python fg:text_light"

[conda]
format = "[ $symbol$environment ]($style)"
style = "bg:conda fg:text_light"
ignore_base = false
disabled = false
symbol = " "

[java]
format = "[ $symbol$version ]($style)"
style = "bg:java fg:text_light"
version_format = "${raw}"
symbol = " "
disabled = false

[c]
format = "[ $symbol($version(-$name)) ]($style)"
style = "bg:clang fg:text_light"
symbol = " "
version_format = "${raw}"
disabled = false

[rust]
format = "[ $symbol$version ]($style)"
style = "bg:rust fg:text_light"
symbol = " "
version_format = "${raw}"
disabled = false

[env_var.all_proxy]
variable = 'all_proxy'
format = "[$env_value]($style) "
default = ''
style = 'bold #82AAFF'

