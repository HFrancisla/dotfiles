# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                          Hyprland Configuration                            ║
# ║              https://wiki.hypr.land/Configuring/                           ║
# ╚══════════════════════════════════════════════════════════════════════════════╝


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                       MACHINE-LOCAL OVERRIDES                               │
# └──────────────────────────────────────────────────────────────────────────────┘
# 本地配置 (GPU 环境变量、特定设备等)，由 install_desktop.sh 自动生成
# 文件不存在时 Hyprland 会静默忽略，不会报错
source = ~/.config/hypr/local.conf


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              MONITORS                                       │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Monitors/
monitor = , preferred, auto, auto


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            MY PROGRAMS                                      │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Keywords/
$terminal    = kitty
$fileManager = thunar
$menu        = anyrun


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                             AUTOSTART                                       │
# └──────────────────────────────────────────────────────────────────────────────┘
exec-once = fcitx5 -d
exec-once = mako
exec-once = waybar
exec-once = thunar --daemon
exec-once = clash-verge
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# 剪贴板管理 (wl-clipboard + cliphist)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# XDG Desktop Portal (屏幕共享、文件选择等)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                        ENVIRONMENT VARIABLES                                │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Environment-variables/

# Wayland / Electron 支持
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# GPU 相关环境变量 (VA-API 驱动等) 由 install_desktop.sh 自动生成到本地配置文件
# 请勿在此硬编码 LIBVA_DRIVER_NAME，使用下方 source 的 local.conf 覆盖
# 如需 NVIDIA 混合显卡优化，也请写入 local.conf
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# 截图保存目录
env = DEFAULT_TARGET_DIR,$HOME/Pictures/Screenshots

# 光标大小
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XDG 环境
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Qt Wayland 支持
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK 主题 (按需修改)
# env = GTK_THEME,Adwaita:dark


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                             PERMISSIONS                                     │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Permissions/
# 注意: 权限修改需要重启 Hyprland，不会热加载

# ecosystem {
#     enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            LOOK AND FEEL                                    │
# └──────────────────────────────────────────────────────────────────────────────┘

# ── General ───────────────────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in    = 2
    gaps_out   = 1
    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types
    col.active_border   = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # 允许通过拖拽边框来调整窗口大小
    resize_on_border = true

    # https://wiki.hypr.land/Configuring/Tearing/
    allow_tearing = false

    layout = dwindle
}

# ── Decoration ────────────────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding       = 10
    rounding_power = 2

    # 聚焦/非聚焦窗口透明度
    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled      = true
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled   = true
        size      = 3
        passes    = 1
        vibrancy  = 0.1696
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # 贝塞尔曲线 — https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # 动画配置 — https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                          WORKSPACE RULES                                    │
# └──────────────────────────────────────────────────────────────────────────────┘
# https://wiki.hypr.land/Configuring/Workspace-Rules/

# "Smart gaps" — 仅一个窗口时移除gap
workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule {
    name = no-gaps-wtv1
    match:float = false
    match:workspace = w[tv1]
    border_size = 0
    rounding = 0
}

windowrule {
    name = no-gaps-f1
    match:float = false
    match:workspace = f[1]
    border_size = 0
    rounding = 0
}


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                              LAYOUTS                                        │
# └──────────────────────────────────────────────────────────────────────────────┘

# https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    preserve_split = true  # 保持分割方向
}

# https://wiki.hypr.land/Configuring/Master-Layout/
master {
    new_status = master
}


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                               MISC                                          │
# └──────────────────────────────────────────────────────────────────────────────┘
# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1   # 0 或 1 禁用动漫壁纸
    disable_hyprland_logo   = false
    focus_on_activate       = true  # 窗口请求焦点时自动切换
    on_focus_under_fullscreen = 2  # 新窗口请求焦点时退出全屏/最大化
}


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                               INPUT                                         │
# └──────────────────────────────────────────────────────────────────────────────┘
# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options =
    kb_rules   =

    follow_mouse = 1
    sensitivity  = 0   # -1.0 ~ 1.0, 0 表示不修改

    touchpad {
        natural_scroll = true
        tap-to-click   = true
    }
}

# ── Gestures ──────────────────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Gestures/
gesture = 3, horizontal, workspace

# ── Per-device 配置示例 ───────────────────────────────────────────────────────
# https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs
# 如需为特定设备配置，请在 local.conf 中添加:
# device {
#     name = your-actual-device-name   # 使用 hyprctl devices 查看设备名
#     sensitivity = -0.5
# }


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            KEYBINDINGS                                      │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER

# ── 基础操作 ──────────────────────────────────────────────────────────────────
bind = $mainMod,       Return, exec, $terminal
bind = $mainMod,       Q,      killactive,
bind = $mainMod,       E,      exec, $fileManager
bind = $mainMod,       space,  exec, $menu
bind = $mainMod,       M,      exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod,        V, togglefloating,
# 一键连招：强制变为悬浮窗，并立刻移到屏幕正中央（--batch 合并为一次 IPC 调用，减少延迟）
bind = $mainMod SHIFT, V, exec, hyprctl --batch "dispatch togglefloating ; dispatch centerwindow"
bind = $mainMod,       P,      pseudo,           # dwindle 伪平铺
bind = $mainMod,       F,      fullscreen, 1     # maximize 模式
bind = $mainMod SHIFT, F,      fullscreen, 0     # 真正全屏

# ── 窗口分组 (Tabbed 模式) ────────────────────────────────────────────────────
bind = $mainMod,       G,   togglegroup
bind = $mainMod,       TAB, changegroupactive, f
bind = $mainMod SHIFT, TAB, changegroupactive, b

# ── 锁屏 ──────────────────────────────────────────────────────────────────────
bind = $mainMod, Escape, exec, loginctl lock-session

# ── 截图 (grimblast —— 带画面冻结) ───────────────────────────────────────────
# 区域截图（冻结屏幕 + 复制到剪贴板）
bind = ,         Print, exec, grimblast --freeze --notify copy area
# 区域截图（冻结屏幕 + 保存到文件 + 同时复制到剪贴板）
bind = ALT,      Print, exec, grimblast --freeze --notify copysave area
# 全屏截图（复制到剪贴板）
bind = $mainMod, Print, exec, grimblast --notify copy output

# ── 剪贴板历史 (带安全阀的自动粘贴) ──────────────────────────────────────────
# 逻辑：呼出列表 -> 检查是否选中内容 -> 若选中则解码并自动 Ctrl+V，若按 Esc 退出则静默取消，防止误操作
bind = $mainMod SHIFT, C, exec, sh -c 'selected=$(cliphist list | anyrun --plugins libstdin.so) && [ -n "$selected" ] && echo "$selected" | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl -P v -m ctrl'

# ── 焦点切换 ──────────────────────────────────────────────────────────────────
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# ── 窗口移动 ──────────────────────────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# ── 窗口大小调整 (方向键微调) ─────────────────────────────────────────────────
binde = $mainMod, left,  resizeactive, -20 0
binde = $mainMod, right, resizeactive,  20 0
binde = $mainMod, up,    resizeactive,   0 -20
binde = $mainMod, down,  resizeactive,   0  20

# ── 切换工作区 ────────────────────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# ── 移动窗口到工作区 ──────────────────────────────────────────────────────────
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# ── 特殊工作区 (Scratchpad) ───────────────────────────────────────────────────
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# ── 鼠标滚轮切换工作区 ───────────────────────────────────────────────────────
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ── 鼠标移动/调整窗口 ────────────────────────────────────────────────────────
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── 多媒体按键 ────────────────────────────────────────────────────────────────
# 音量控制
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# 屏幕亮度控制
binde = , XF86MonBrightnessUp,   exec, brightnessctl set 2%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

# 媒体播放控制 (需要 playerctl)
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                        WINDOWS AND WORKSPACES                               │
# └──────────────────────────────────────────────────────────────────────────────┘
# See https://wiki.hypr.land/Configuring/Window-Rules/

# ── 全局规则 ──────────────────────────────────────────────────────────────────
windowrule {
    # 阻止所有应用的 maximize 请求
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

windowrule {
    # 修复 XWayland 拖拽问题
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# ── 应用专属规则 ──────────────────────────────────────────────────────────────
windowrule {
    name = move-hyprland-run
    match:class = hyprland-run
    move = 20 monitor_h-120
    float = yes
}

windowrule {
    # 密码认证弹窗浮动
    name = polkit-auth-float
    match:class = ^(polkit-gnome-authentication-agent-1)$
    float = on
}

windowrule {
    # pavucontrol 浮动居中
    name = pavucontrol-float-center
    match:class = ^(pavucontrol)$
    float = on
    center = on
}

windowrule {
    # 文件选择器 / 对话框浮动
    name = dialog-float
    match:title = ^(Open|Save|Choose|Select|打开|保存|选择).*$
    float = on
    center = on
}

windowrule {
    # 图片查看器浮动
    name = imv-float
    match:class = ^(imv)$
    float = on
}

windowrule {
    # Firefox 画中画
    name = firefox-pip
    match:class = ^(firefox)$
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
}


# ┌──────────────────────────────────────────────────────────────────────────────┐
# │                            LAYER RULES                                      │
# └──────────────────────────────────────────────────────────────────────────────┘

# Waybar 高斯模糊 (适配 Hyprland 0.53+)
layerrule = blur on,          match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar

# Anyrun 启动器模糊
layerrule = blur on,          match:namespace anyrun
layerrule = ignore_alpha 0.5, match:namespace anyrun
