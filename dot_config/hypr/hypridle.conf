general {
    lock_cmd = pidof hyprlock || hyprlock       # 避免重复启动多个锁屏进程
    before_sleep_cmd = loginctl lock-session    # 电脑休眠前先锁屏
    after_sleep_cmd = hyprctl dispatch dpms on  # 唤醒后点亮屏幕
}

# 1. 7分钟无操作：调暗屏幕 (节省电力 + 提醒即将锁屏)
listener {
    timeout = 420                                
    on-timeout = brightnessctl set 10% -s       # 需要安装 brightnessctl
    on-resume = brightnessctl -r                 # 恢复 -s 保存的亮度
}

# 2. 8分钟无操作：正式锁屏
listener {
    timeout = 480                                
    on-timeout = loginctl lock-session           
}

# 3. 10分钟无操作：关闭显示器
listener {
    timeout = 600                                
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}
