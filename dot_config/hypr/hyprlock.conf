# ~/.config/hypr/hyprlock.conf
general {
	ignore_empty_input = true
	prevent_space_input = true
	hide_cursor = true
}

# --- 背景设置 ---
background {
    monitor =
    # 替换为你自己喜欢的壁纸路径
    path = ~/.config/wallpapers/lock.png 
    
    # 极具质感的毛玻璃模糊特效 (知其然：通过调节 passes 和 size 控制模糊深度)
    blur_passes = 1
    blur_size = 5
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- 密码输入框 ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33 # 密码圆点的大小
    dots_spacing = 0.15 # 密码圆点的间距
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i> # 提示文字，支持 Pango 标记语言
    hide_input = false
    
    position = 0, -150
    halign = center
    valign = center
}

# --- 大写时间显示 ---
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 100
    font_family = JetBrains Mono Nerd Font ExtraBold # 推荐使用 Nerd Font
    position = 0, 80
    halign = center
    valign = center
}

# --- 问候语 ---
label {
    monitor =
    text = Welcome, $USER 😊
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = JetBrains Mono Nerd Font
    position = 0, -20
    halign = center
    valign = center
}
